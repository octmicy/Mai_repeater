[plugin]
enabled = true
config_version = "1.0.0"

[repeat]
min_count = 3
min_senders = 3
window_seconds = 120.0
max_text_length = 300
cooldown_seconds = 90.0
delay_min = 0.5
delay_max = 2.0
case_insensitive = false
normalize_whitespace = true

[once]
# 同一句话的已复读记忆时长（秒）：只覆盖当次复读潮的上下文，5 分钟
repeated_memory_ttl = 300.0

[planner_guard]
enabled = true
# 待注入提示的有效期（秒）：只注入一次，注入后立即消费；超时未消费则作废
pending_ttl = 180.0

[filter]
ignored_user_ids = []
bot_user_ids = []
# 不复读自己说的话：从主程序配置读取 bot 账号（qq_account/platforms），并识别消息自带账号标识
auto_exclude_self = true
# 复读文本中出现机器人昵称/别名时不跟读（读取 bot.nickname / bot.alias_names）
exclude_bot_names = true
# 额外补充的机器人称呼（主程序里没配的昵称填这里）
bot_names_extra = []
# 图片/表情/语音等非文本消息不参与复读（插件只能发文字，复读表情包没意义）
exclude_non_text = true
# 文本命中这些关键词不参与复读：MaiBot 会把表情包文本化成「[表情包：xxx]」
exclude_keywords = ["表情包", "[图片]", "[动画表情]", "[语音]", "[视频]", "[文件]"]

[debug]
dump_message_structure = false
verbose_log = false
